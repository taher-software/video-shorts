[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "picsou-shorts"
version = "0.1.0"
description = "Pipeline de generation de video Shorts par IA — Picsou Parle"
requires-python = ">=3.11"
dependencies = [
    # Web / CLI
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    # AI APIs
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    # Image processing
    "Pillow>=10.3.0",
    # Audio processing
    "pydub>=0.25.1",
    "numpy>=1.26.0",
    # FFmpeg wrapper
    "ffmpeg-python>=0.2.0",
    # Config / env
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Async HTTP
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
picsou = "src.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
